name: Production quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean production build
    if: github.repository == 'Zy0x/SIPENA-Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout synced source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Run static validation
        run: |
          npm run typecheck
          npm run lint -- --quiet

      - name: Run regression suite
        run: npm test

      - name: Build production bundle
        env:
          VITE_APP_ENV: production
        run: npm run build

      - name: Verify deploy artifact
        run: npm run verify:web:dist

      - name: Upload verified web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sipena-web-${{ github.sha }}
          path: apps/frontend/dist
          if-no-files-found: error
          retention-days: 7
