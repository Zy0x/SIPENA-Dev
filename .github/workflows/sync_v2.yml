name: Sync from Organization Web Project v2

on:
  workflow_dispatch:
    inputs:
      target_repo_name:
        description: "Nama repo di Organization Web-Modder"
        required: true
      target_branch:
        description: "Branch di Organization"
        required: true
        default: "main"
      sync_mode:
        description: "Mode sinkronisasi"
        required: true
        default: "blacklist"
        type: choice
        options:
          - whitelist
          - blacklist

  repository_dispatch:
    types: [sync-from-org]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proyek utama
        uses: actions/checkout@v4
        with:
          path: main-project
          fetch-depth: 0

      - name: Load config otomatis
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="main-project/sync"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Config tidak ditemukan: $CONFIG_FILE"
            exit 1
          fi

          read_config() {
            local key="$1"
            local value
            value="$(grep -E "^${key}=" "$CONFIG_FILE" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | xargs)"
            printf "%s" "$value"
          }

          TARGET_REPO="$(read_config TARGET_REPO)"
          TARGET_BRANCH="$(read_config TARGET_BRANCH)"
          SYNC_MODE="$(read_config SYNC_MODE)"

          if [ -z "$TARGET_REPO" ]; then
            echo "TARGET_REPO kosong di file sync"
            exit 1
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            echo "TARGET_BRANCH kosong di file sync"
            exit 1
          fi

          if [ -z "$SYNC_MODE" ]; then
            echo "SYNC_MODE kosong di file sync"
            exit 1
          fi

          if [[ "$SYNC_MODE" != "whitelist" && "$SYNC_MODE" != "blacklist" ]]; then
            echo "SYNC_MODE tidak valid: $SYNC_MODE"
            exit 1
          fi

          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          echo "SYNC_MODE=$SYNC_MODE" >> "$GITHUB_ENV"

      - name: Load input manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REPO="${{ github.event.inputs.target_repo_name }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
          SYNC_MODE="${{ github.event.inputs.sync_mode }}"

          if [ -z "$TARGET_REPO" ] || [ -z "$TARGET_BRANCH" ] || [ -z "$SYNC_MODE" ]; then
            echo "Input manual tidak lengkap"
            exit 1
          fi

          if [[ "$SYNC_MODE" != "whitelist" && "$SYNC_MODE" != "blacklist" ]]; then
            echo "SYNC_MODE tidak valid: $SYNC_MODE"
            exit 1
          fi

          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          echo "SYNC_MODE=$SYNC_MODE" >> "$GITHUB_ENV"

      - name: Validasi token
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.SYNC_PROJECT_WEB_PAT }}" ]; then
            echo "Secret SYNC_PROJECT_WEB_PAT belum dikonfigurasi"
            exit 1
          fi

      - name: Debug config
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CONFIG ====="
          echo "Source : Web-Modder/${TARGET_REPO}"
          echo "Branch : ${TARGET_BRANCH}"
          echo "Mode   : ${SYNC_MODE}"
          echo "Target : ${GITHUB_REPOSITORY}"
          echo "=================="

      - name: Checkout repo organization
        uses: actions/checkout@v4
        with:
          repository: Web-Modder/${{ env.TARGET_REPO }}
          token: ${{ secrets.SYNC_PROJECT_WEB_PAT }}
          path: org-source
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Sinkronisasi
        shell: bash
        run: |
          set -euo pipefail

          cd main-project

          declare -a WHITELIST_PATHS=(
            "shared/"
          )

          declare -a BLACKLIST_PATHS=(
            ".git/"
            ".github/"
            ".lovable/"
            ".netlify/"
            "docs/"
            "node_modules/"
            "dist/"
            "build/"
            ".env"
            ".env.*"
            "**/.env"
            "**/.env.*"
            "/*.md"
          )

          if [[ "$SYNC_MODE" == "whitelist" ]]; then
            echo "Mode whitelist"

            for path in "${WHITELIST_PATHS[@]}"; do
              if [ -e "../org-source/$path" ]; then
                mkdir -p "$(dirname "$path")"
                rsync -a --checksum --delete "../org-source/$path" "$path"
              else
                echo "Path whitelist tidak ditemukan di source: $path"
              fi
            done
          else
            echo "Mode blacklist"

            EXCLUDE_ARGS=(--exclude='.git')

            for p in "${BLACKLIST_PATHS[@]}"; do
              EXCLUDE_ARGS+=(--exclude "$p")
            done

            rsync -a --checksum --delete "${EXCLUDE_ARGS[@]}" ../org-source/ .
          fi

      - name: Commit dan push
        shell: bash
        run: |
          set -euo pipefail

          cd main-project

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk disinkronkan"
            exit 0
          fi

          git status --short
          git commit -m "chore: auto sync from Web-Modder/${TARGET_REPO}"
          git push
          echo "Sync berhasil"
