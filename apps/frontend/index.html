<!doctype html>

  <head>
    <script>
      // Inline script to prevent theme flash - Default to LIGHT mode
      (function() {
        const savedTheme = localStorage.getItem("theme");
        // Only apply dark mode if explicitly saved as dark
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <style>
      html, body { background: #eff6ff; }
      #sipena-boot-splash { display: none; }
      @media (display-mode: standalone) {
        #sipena-boot-splash {
          position: fixed; inset: 0; z-index: 2147483647; display: grid;
          place-items: center; background: #eff6ff; color: #0f172a;
          transition: opacity 180ms ease-out, visibility 180ms ease-out;
        }
        #sipena-boot-splash[data-closing="true"] { opacity: 0; visibility: hidden; }
        .sipena-boot-mark { display: grid; justify-items: center; gap: 18px; }
        .sipena-boot-mark img {
          width: clamp(112px, 30vw, 156px); aspect-ratio: 1; object-fit: contain;
          filter: drop-shadow(0 18px 28px rgba(37, 99, 235, .18));
          animation: sipena-boot-enter 420ms cubic-bezier(.2,.8,.2,1) both;
        }
        .sipena-boot-mark strong { font: 700 22px/1.2 system-ui, sans-serif; letter-spacing: 0; }
        .sipena-boot-mark span { font: 500 13px/1.4 system-ui, sans-serif; color: #64748b; }
        @keyframes sipena-boot-enter { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { .sipena-boot-mark img { animation: none; } }
      }
    </style>

    <script>
      // Early PWA install prompt capture for faster banner display
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.__pwa_deferred_prompt = e;
        window.__pwa_prompt_available = true;
        window.dispatchEvent(new Event('pwa_prompt_ready'));
      });
      // NOTE: Service worker registration is now handled exclusively by
      // vite-plugin-pwa (registerSW in src/app/main.tsx). The previous manual
      // registration of /sw.js conflicted with the virtual SW and caused
      // update notifications to be missed when caches were stale.
    </script>
